services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: sana
      POSTGRES_PASSWORD: sana
      POSTGRES_DB: sana
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sana']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
